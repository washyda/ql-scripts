name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript source
        run: npm run check

      - name: Smoke test TypeScript task
        run: npx tsx scripts/hello_world.ts

      - name: Reject generated task JavaScript
        shell: bash
        run: |
          if find scripts -maxdepth 1 -type f -name '*.js' | grep -q .; then
            echo 'Do not commit generated JavaScript tasks.'
            exit 1
          fi
